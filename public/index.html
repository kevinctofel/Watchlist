<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 TV & Movie Watchlist</title>
    <style>
        /* Same CSS as before - unchanged */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f7fa;
            color: #333;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.2em;
        }
        
        .add-form {
            background-color: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid #e9ecef;
        }
        
        .add-form h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        .items-container {
            margin-top: 30px;
        }
        
        .items-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .items-header h2 {
            color: #2c3e50;
            font-size: 1.5em;
        }
        
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .item-card {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #3498db;
            transition: transform 0.2s;
        }
        
        .item-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }
        
        .item-info {
            margin-bottom: 10px;
        }
        
        .item-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .item-meta {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
        
        .item-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-sm {
            padding: 8px 16px;
            font-size: 0.9em;
        }
        
        .btn-edit {
            background-color: #f39c12;
        }
        
        .btn-edit:hover {
            background-color: #e67e22;
        }
        
        .btn-delete {
            background-color: #e74c3c;
        }
        
        .btn-delete:hover {
            background-color: #c0392b;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
            font-style: italic;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .add-form, .items-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📺 TV & Movie Watchlist</h1>
        
        <div class="add-form">
            <h2>Add New Item</h2>
            <form id="add-item-form">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type" name="type" required>
                        <option value="movie">Movie</option>
                        <option value="tv">TV Show</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" name="year" min="1800" max="2026">
                </div>
                <div class="form-group">
                    <label for="genre">Genre</label>
                    <input type="text" id="genre" name="genre">
                </div>
                <button type="submit">Add to Watchlist</button>
            </form>
        </div>
        
        <div class="items-container">
            <div class="items-header">
                <h2>Watchlist Items</h2>
                <span id="count">0 items</span>
            </div>
            
            <div id="items-list" class="items-list">
                <!-- Items will be populated here by JavaScript -->
            </div>
            
            <div id="empty-state" class="empty-state">
                Your watchlist is empty. Add your first item to get started!
            </div>
        </div>
    </div>

    <script>
        // DOM elements
        const addItemForm = document.getElementById('add-item-form');
        const itemsList = document.getElementById('items-list');
        const emptyState = document.getElementById('empty-state');
        const countSpan = document.getElementById('count');
        
        // Storage key
        const STORAGE_KEY = 'watchlistItems';
        
        // Load items from localStorage
        function loadItems() {
            try {
                const items = localStorage.getItem(STORAGE_KEY);
                return items ? JSON.parse(items) : [];
            } catch (error) {
                console.error('Error loading items from localStorage:', error);
                return [];
            }
        }
        
        // Save items to localStorage
        function saveItems(items) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
            } catch (error) {
                console.error('Error saving items to localStorage:', error);
            }
        }
        
        // Display items in the UI
        function displayItems(items) {
            itemsList.innerHTML = '';
            countSpan.textContent = `${items.length} items`;
            
            if (items.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            items.forEach(item => {
                const itemCard = document.createElement('div');
                itemCard.className = 'item-card';
                
                itemCard.innerHTML = `
                    <div class="item-info">
                        <div class="item-title">${item.title}</div>
                        <div class="item-meta">
                            <span>Type: ${item.type}</span> • 
                            <span>Year: ${item.year || 'N/A'}</span> • 
                            <span>Genre: ${item.genre || 'N/A'}</span>
                        </div>
                    </div>
                    <div class="item-actions">
                        <button class="btn-sm btn-edit" data-id="${item.id}">Edit</button>
                        <button class="btn-sm btn-delete" data-id="${item.id}">Delete</button>
                    </div>
                `;
                
                itemsList.appendChild(itemCard);
                
                // Add event listeners to edit/delete buttons
                const editBtn = itemCard.querySelector('.btn-edit');
                const deleteBtn = itemCard.querySelector('.btn-delete');
                
                editBtn.addEventListener('click', () => {
                    editItem(item.id);
                });
                
                deleteBtn.addEventListener('click', () => {
                    deleteItem(item.id);
                });
            });
        }
        
        // Add new item
        addItemForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const type = document.getElementById('type').value;
            const year = document.getElementById('year').value;
            const genre = document.getElementById('genre').value;
            
            const newItem = {
                id: Date.now(), // Simple ID generation
                title,
                type,
                year: year || null,
                genre: genre || null,
                addedAt: new Date().toISOString()
            };
            
            try {
                const items = loadItems();
                items.push(newItem);
                saveItems(items);
                displayItems(items);
                addItemForm.reset();
            } catch (error) {
                console.error('Error adding item:', error);
                alert('Failed to add item. Please try again.');
            }
        });
        
        // Edit item
        function editItem(id) {
            const items = loadItems();
            const itemIndex = items.findIndex(i => i.id === id);
            
            if (itemIndex === -1) return;
            
            const item = items[itemIndex];
            
            const title = prompt('Enter new title:', item.title);
            const type = prompt('Enter new type (movie/tv):', item.type);
            const year = prompt('Enter new year:', item.year);
            const genre = prompt('Enter new genre:', item.genre);
            
            if (!title) return;
            
            try {
                const updatedItem = {
                    ...item,
                    title,
                    type: type || item.type,
                    year: year || item.year,
                    genre: genre || item.genre,
                    updatedAt: new Date().toISOString()
                };
                
                items[itemIndex] = updatedItem;
                saveItems(items);
                displayItems(items);
            } catch (error) {
                console.error('Error updating item:', error);
                alert('Failed to update item. Please try again.');
            }
        }
        
        // Delete item
        function deleteItem(id) {
            if (!confirm('Are you sure you want to delete this item?')) return;
            
            try {
                const items = loadItems();
                const filteredItems = items.filter(i => i.id !== id);
                saveItems(filteredItems);
                displayItems(filteredItems);
            } catch (error) {
                console.error('Error deleting item:', error);
                alert('Failed to delete item. Please try again.');
            }
        }
        
        // Initialize the app
        function init() {
            const items = loadItems();
            displayItems(items);
        }
        
        // Start the app
        init();
    </script>
</body>
</html>
